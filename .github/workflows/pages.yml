name: Publish Decision Room
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify the website
        run: |
          mkdir site
          for part in site-*.zip; do unzip -qo "$part" -d site; done
          test -s site/index.html
          test -s site/data/cards.json
          test "$(find site/pdf -type f -name "*.pdf" | wc -l)" -eq 22
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
